<!doctype html><html><head><meta charset="utf-8"></head><body><script>
  addEventListener('message', (event) => {
    if (event.data?.type === 'pixelverse.locale.update') {
      parent.postMessage({ type: 'fixture.locale.received', locale: event.data.locale }, location.origin);
    }
  });
  setTimeout(() => parent.postMessage({ type: 'pixelverse.cutaway.state', open: true }, location.origin), 50);
</script></body></html>
